# 个人选股 App 配置示例。
# 复制为 config/config.yaml 后按需修改；config.yaml 不应提交真实 Key（Key 只走环境变量）。

app:
  market: cn_a            # 本期仅 A 股（沪深京）
  disclaimer: "本系统仅供研究，不构成投资建议；实盘前须充分回测并计入成本，盈亏自负。"

# ── 数据源（适配器化，主源失效可回退备用源）──────────────────
datasource:
  primary: tushare        # akshare(免费无Key) | baostock(免费有财务,不被封) | tushare(需积分)
  fallback: baostock      # 主源失效时回退；baostock 免费、含真实财务+披露日
  adjust: hfq             # 复权方式：none | qfq(前复权) | hfq(后复权)；回测默认后复权
  retry: 3
  retry_backoff_s: 2

# ── 存储 ────────────────────────────────────────────────────
storage:
  backend: sqlite         # sqlite | duckdb(进阶)
  path: data_store/aselect.sqlite
  parquet_dir: data_store/parquet

# ── 回测：必须计入 A 股真实交易摩擦 ─────────────────────────
backtest:
  benchmark: "000300"     # 沪深300
  commission: 0.00025     # 佣金（双边，万2.5）
  stamp_tax: 0.001        # 印花税（卖出单边）
  transfer_fee: 0.00001   # 过户费
  slippage: 0.001         # 滑点
  cash: 1000000
  t_plus_1: true          # 模拟 T+1
  limit_up_down: true     # 涨跌停无法成交
  delist_haircut: 0.5     # 段内退市持仓按最后价×(1-该值)清算（退市整理/转板损失，保守估计）
  # 可交易股票池过滤（用户无科创板/北交所权限，且回避 ST）：
  exclude_star_market: true   # 剔除科创板(688/689)
  exclude_bse: true           # 剔除北交所(4/8)
  exclude_st: true            # 剔除 ST/*ST

# ── 自动调度（收盘后增量同步；python -m aselect.scheduler）────
scheduler:
  hour: 16                # 每个交易日 16:30 跑 sync（A 股节假日空跑无副作用）
  minute: 30
  limit: 0                # 0=全市场；调小可限制每次同步只数

# ── AI 模块（热插拔 · 铁律二）──────────────────────────────
ai:
  enabled: false          # 全局开关；false 时整套系统仍可运行
  provider: none          # anthropic | openai | local | none
  model: claude-haiku-4-5 # 初筛用便宜模型，精读可配贵模型
  api_key_env: AI_API_KEY # Key 只从环境变量读取，禁止写入代码/仓库
  base_url: null          # 兼容自托管/OpenAI 协议的本地模型
  timeout_s: 30
  cache_dir: .cache/ai    # 同文本不重复请求
  features:               # 每个接入点可独立开关
    sentiment: true
    event_extraction: true
    nl_to_filter: false
    report_generation: true

# ── 基金推荐子系统（v1：净值动量+风险调整，月频，扣申赎费）────
fund:
  top_n: 10                  # TopN 推荐数量（等权）
  rebalance_day: last        # 调仓日：last=每月最后一个交易日
  confirm_lag: 1             # 场外申赎 T+1 净值确认
  screen:                    # 初筛阈值
    min_scale_yi: 2          # 最新规模下限（亿元）
    min_age_days: 365        # 成立天数下限
    min_ret_1y: 0.0          # 近1年收益下限（近1年夏普>0 的可得代理）
  fee:                       # 场外申赎费率（外扣法）
    subscribe: 0.0015        # 打折后申购费
    redeem_lte7d: 0.015      # 持有<7天惩罚性赎回费（必须建模）
    redeem_lte30d: 0.0075    # <30天
    redeem_lte365d: 0.005    # <365天
    redeem_gt365d: 0.0       # ≥365天
  etf:                       # 场内 ETF 摩擦
    commission: 0.00025      # 佣金万2.5
    slippage: 0.0005         # 滑点 5bps
  weights:                   # 合成权重（默认 ICIR 收缩定权；固定权重备用）
    mode: fixed              # icir | fixed（v1 预注册：fixed 权重；icir 供对比研究）
    shrink: 0.5              # 向正 IC 因子等权收缩比例
    max_weight: 0.4          # 单因子权重上限
    fixed: {dd_pen: 0.55, mom3: 0.15, mom6: 0.1, size_fee: 0.2}
  benchmark: "000300"        # 对比基准（新浪源 sh000300）
  sync:
    sleep_s: 0.3             # akshare 限速（基本信息批量拉）
    retry: 3

# ── 通知（配置驱动·热插拔；未启用或缺 webhook 时回退 NullNotifier）──
notify:
  enabled: false          # 全局开关；false 时核心照跑，仅本地打印候选
  channel: feishu         # 目前支持 feishu
  webhook_url_env: FEISHU_WEBHOOK  # webhook URL 只从环境变量读，禁止写入配置/仓库
  timeout_s: 5
